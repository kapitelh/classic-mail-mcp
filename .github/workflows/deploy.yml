name: Deploy Cloud Run
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: classic-mail-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION SERVICE REPOSITORY WIF_PROVIDER DEPLOY_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production variable: $name"
              exit 1
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and test release image
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -t classic-mail-mcp:local .
          node scripts/docker-smoke.mjs
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: classic-mail-mcp:local
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push immutable release image
        shell: bash
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev"
          image="${registry}/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          docker tag classic-mail-mcp:local "$image"
          docker push "$image"
          digest="$(gcloud artifacts docker images describe "$image" --project="$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "RELEASE_IMAGE=${image%:*}@$digest" >> "$GITHUB_ENV"
      - name: Deploy candidate, verify, and promote
        run: bash scripts/release-cloud-run.sh
